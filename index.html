<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boussole Vent & Nuages en Temps Réel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 390px;
            width: 100%;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Boussole Cadran */
        .compass-outer {
            position: relative;
            width: 250px;
            height: 250px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin: 15px auto;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* La Rose des vents (pivote avec l'orientation du téléphone) */
        .compass-dial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.1s ease-out;
        }

        .cardinal {
            position: absolute;
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        .cardinal.n { top: 10px; left: 50%; transform: translateX(-50%); color: #ff4757; }
        .cardinal.e { right: 12px; top: 50%; transform: translateY(-50%); }
        .cardinal.s { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .cardinal.w { left: 12px; top: 50%; transform: translateY(-50%); }

        /* Conteneurs pour l'orientation des flèches */
        .arrow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        /* Flèche 1 : Vent au sol (Bleue - fine et longue) */
        .arrow-ground {
            position: absolute;
            top: 25px;
            left: calc(50% - 7px);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 85px solid #00d2d3;
            filter: drop-shadow(0px 0px 6px rgba(0, 210, 211, 0.8));
        }

        /* Flèche 2 : Vent en altitude / Nuages (Jaune - plus large et trapu) */
        .arrow-cloud {
            position: absolute;
            top: 45px;
            left: calc(50% - 10px);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 65px solid #f1c40f;
            filter: drop-shadow(0px 0px 6px rgba(241, 196, 15, 0.8));
            opacity: 0.85;
        }

        /* Indicateur du cap de l'appareil (fixe en haut) */
        .heading-marker {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid #ffffff;
            z-index: 10;
        }

        /* Légende & Informations */
        .legend {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 12px;
        }

        .legend-item {
            text-align: center;
        }

        .legend-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .legend-title.ground { color: #00d2d3; }
        .legend-title.cloud { color: #f1c40f; }

        .val-speed {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .val-deg {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        #status {
            font-size: 0.85rem;
            margin-top: 15px;
            opacity: 0.7;
            font-style: italic;
        }

        .btn {
            margin-top: 15px;
            background: #00d2d3;
            border: none;
            color: #1e272e;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
        }
    </style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>
<body>

    <div class="card">
        <h1>Boussole Vent & Nuages</h1>
        
        <div class="compass-outer">
            <div class="heading-marker"></div>
            <div class="compass-dial" id="compassDial">
                <span class="cardinal n">N</span>
                <span class="cardinal e">E</span>
                <span class="cardinal s">S</span>
                <span class="cardinal w">O</span>
                
                <!-- Flèche Vent en Altitude (Nuages) -->
                <div class="arrow-container" id="cloudArrowContainer">
                    <div class="arrow-cloud"></div>
                </div>

                <!-- Flèche Vent au Sol -->
                <div class="arrow-container" id="groundArrowContainer">
                    <div class="arrow-ground"></div>
                </div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-title ground">Vent Sol (10m)</div>
                <div class="val-speed" id="groundSpeed">-- km/h</div>
                <div class="val-deg" id="groundDeg">--°</div>
            </div>
            <div class="legend-item">
                <div class="legend-title cloud">Nuages (~1500m)</div>
                <div class="val-speed" id="cloudSpeed">-- km/h</div>
                <div class="val-deg" id="cloudDeg">--°</div>
            </div>
        </div>

        <p id="status">Clique sur le bouton pour démarrer.</p>
        <button class="btn" id="permissionBtn" onclick="initSensors()">Activer Capteurs & GPS</button>
    </div>

    <script>
        let compassHeading = 0;

        function initSensors() {
            document.getElementById('status').textContent = "Demande d'accès aux capteurs...";
            
            // 1. Géolocalisation
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(fetchWeatherData, handleGeoError);
            } else {
                document.getElementById('status').textContent = "Géolocalisation non supportée.";
            }

            // 2. Gyroscope / Boussole
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        } else {
                            document.getElementById('status').textContent = "Accès au gyroscope refusé.";
                        }
                    })
                    .catch(console.error);
            } else if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function handleOrientation(event) {
            let heading = null;

            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading; // iOS Safari
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha; // Android / Standard
            }

            if (heading !== null) {
                compassHeading = heading;
                updateCompassUI();
            }
        }

        function fetchWeatherData(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // Requête météo : vent au sol + vent à 850 hPa (~1 500m d'altitude)
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=windspeed_850hpa,winddirection_850hpa`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.current_weather && data.hourly) {
                        // Données au sol
                        const groundDir = data.current_weather.winddirection;
                        const groundSpd = data.current_weather.windspeed;

                        // Données en altitude (nuages) correspondant à l'heure actuelle
                        const currentHour = new Date().getHours();
                        const cloudDir = data.hourly.winddirection_850hpa[currentHour];
                        const cloudSpd = data.hourly.windspeed_850hpa[currentHour];

                        // Mise à jour de l'affichage textuel
                        document.getElementById('groundSpeed').textContent = `${groundSpd} km/h`;
                        document.getElementById('groundDeg').textContent = `${groundDir}° (${getCardinal(groundDir)})`;
                        
                        document.getElementById('cloudSpeed').textContent = `${cloudSpd} km/h`;
                        document.getElementById('cloudDeg').textContent = `${cloudDir}° (${getCardinal(cloudDir)})`;

                        // Orienter la flèche du vent au sol
                        document.getElementById('groundArrowContainer').style.transform = `rotate(${groundDir}deg)`;

                        // Orienter la flèche du vent en altitude (nuages)
                        document.getElementById('cloudArrowContainer').style.transform = `rotate(${cloudDir}deg)`;

                        document.getElementById('status').textContent = "Boussole active en temps réel.";
                        document.getElementById('permissionBtn').style.display = 'none';
                        updateCompassUI();
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('status').textContent = "Erreur de récupération des données météo.";
                });
        }

        function updateCompassUI() {
            // Pivote la rose des vents selon l'orientation physique de l'appareil
            const dial = document.getElementById('compassDial');
            dial.style.transform = `rotate(${-compassHeading}deg)`;
        }

        function handleGeoError() {
            document.getElementById('status').textContent = "Erreur de géolocalisation. Active ton GPS.";
        }

        function getCardinal(angle) {
            const dirs = ['N', 'N-E', 'E', 'S-E', 'S', 'S-O', 'O', 'N-O'];
            return dirs[Math.round(angle / 45) % 8];
        }
    </script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
